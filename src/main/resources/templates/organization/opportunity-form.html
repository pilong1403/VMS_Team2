<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Cơ hội</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card-shadow { box-shadow: 0 6px 20px rgba(0,0,0,.06); }
        .required:after { content:" *"; color:#d6336c; }
        .thumb-preview, .section-preview { max-height: 140px; border:1px dashed #ced4da; }
        .form-error { font-size: .9rem; color: #d6336c; cursor: pointer; }
        .is-invalid { border-color: #d6336c !important; }
    </style>
</head>
<body class="bg-light">

<div class="container py-4">

    <!-- Flash alerts (ok / err) -->
    <div id="flashArea" class="mb-2">
        <div th:if="${ok}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${ok}">Thao tác thành công.</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${err}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${err}">Đã xảy ra lỗi.</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>

    <div class="d-flex align-items-center mb-3">
        <h3 class="me-auto" th:text="${pageTitle}">Chỉnh sửa cơ hội</h3>
        <a href="/org/opps" class="btn btn-outline-secondary">Quay lại</a>
    </div>

    <form th:action="@{/org/opps/save}" th:object="${form}" method="post" enctype="multipart/form-data" novalidate id="oppForm">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" th:field="*{oppId}"/>

        <!-- Global errors (đặt BÊN TRONG form có th:object) -->
        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
            <div th:each="e : ${#fields.globalErrors()}" th:text="${e}">Có lỗi dữ liệu, vui lòng kiểm tra lại.</div>
        </div>

        <div class="row g-3">
            <!-- ========== THÔNG TIN CƠ BẢN ========== -->
            <div class="col-12">
                <div class="card card-shadow">
                    <div class="card-header bg-white"><strong>Thông tin cơ bản</strong></div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-8">
                                <label class="form-label required" for="title">Tiêu đề cơ hội</label>
                                <input id="title" type="text" class="form-control"
                                       th:classappend="${#fields.hasErrors('title')} ? ' is-invalid' : ''"
                                       th:field="*{title}" maxlength="500" required>
                                <div class="form-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label required" for="categoryId">Danh mục</label>
                                <select id="categoryId" class="form-select"
                                        th:classappend="${#fields.hasErrors('categoryId')} ? ' is-invalid' : ''"
                                        th:field="*{categoryId}" required>
                                    <option value="" disabled th:selected="${form.categoryId==null}">-- chọn --</option>
                                    <option th:each="c : ${categories}" th:value="${c.categoryId}" th:text="${c.categoryName}"></option>
                                </select>
                                <div class="form-error" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>
                            </div>

                            <div class="col-md-8">
                                <label class="form-label" for="subtitle">Mô tả ngắn</label>
                                <input id="subtitle" type="text" class="form-control"
                                       th:classappend="${#fields.hasErrors('subtitle')} ? ' is-invalid' : ''"
                                       th:field="*{subtitle}" maxlength="500">
                                <div class="form-error" th:if="${#fields.hasErrors('subtitle')}" th:errors="*{subtitle}"></div>
                            </div>

                            <div class="col-md-4" th:if="${form.oppId != null}">
                                <label class="form-label required" for="status">Trạng thái</label>
                                <select id="status" class="form-select"
                                        th:classappend="${#fields.hasErrors('status')} ? ' is-invalid' : ''"
                                        th:field="*{status}" required>
                                    <option th:each="s : ${statuses}"
                                            th:value="${s}"
                                            th:text="${statusVN[s.name()] != null ? statusVN[s.name()] : s}">
                                    </option>
                                </select>
                                <div class="form-error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
                            </div>

                            <!-- Khi tạo mới, đặt hidden mặc định -->
                            <input type="hidden" th:if="${form.oppId == null}" th:field="*{status}" value="OPEN">


                            <div class="col-md-6">
                                <label class="form-label" for="location">Địa điểm</label>
                                <input id="location" type="text" class="form-control"
                                       th:classappend="${#fields.hasErrors('location')} ? ' is-invalid' : ''"
                                       th:field="*{location}" maxlength="255" placeholder="VD: Sapa, Lào Cai">
                                <div class="form-error" th:if="${#fields.hasErrors('location')}" th:errors="*{location}"></div>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label required" for="neededVolunteers">Số TNV cần</label>
                                <input id="neededVolunteers" type="number" min="1" class="form-control"
                                       th:classappend="${#fields.hasErrors('neededVolunteers')} ? ' is-invalid' : ''"
                                       th:field="*{neededVolunteers}" required>
                                <div class="form-error" th:if="${#fields.hasErrors('neededVolunteers')}" th:errors="*{neededVolunteers}"></div>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label" for="thumbInput">Ảnh đại diện</label>
                                <input id="thumbInput" class="form-control" type="file"
                                       th:classappend="${#fields.hasErrors('thumbnailFile')} ? ' is-invalid' : ''"
                                       th:field="*{thumbnailFile}" accept="image/*">
                                <div class="form-error" th:if="${#fields.hasErrors('thumbnailFile')}" th:errors="*{thumbnailFile}"></div>
                                <div class="mt-2">
                                    <img th:if="${form.thumbnailUrl != null and !form.thumbnailUrl.isEmpty()}"
                                         th:src="${form.thumbnailUrl}" class="thumb-preview img-fluid rounded" alt="">
                                    <img id="thumbPreview" class="thumb-preview img-fluid rounded" alt="" style="display:none;">
                                </div>
                                <input type="hidden" th:field="*{thumbnailUrl}">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Thời gian tổ chức -->
            <div class="card card-shadow mb-3">
                <div class="card-header bg-white"><strong>Thời gian tổ chức</strong></div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label required" for="startDate">Ngày bắt đầu</label>
                            <input id="startDate" type="date" class="form-control"
                                   th:classappend="${#fields.hasErrors('startDate')} ? ' is-invalid' : ''"
                                   th:field="*{startDate}" required>
                            <div class="form-error" th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"></div>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label required" for="startTime">Giờ bắt đầu</label>
                            <input id="startTime" type="time" class="form-control"
                                   th:classappend="${#fields.hasErrors('startTime')} ? ' is-invalid' : ''"
                                   th:field="*{startTime}" required>
                            <div class="form-error" th:if="${#fields.hasErrors('startTime')}" th:errors="*{startTime}"></div>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label required" for="endDate">Ngày kết thúc</label>
                            <input id="endDate" type="date" class="form-control"
                                   th:classappend="${#fields.hasErrors('endDate')} ? ' is-invalid' : ''"
                                   th:field="*{endDate}" required>
                            <div class="form-error" th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}"></div>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label required" for="endTime">Giờ kết thúc</label>
                            <input id="endTime" type="time" class="form-control"
                                   th:classappend="${#fields.hasErrors('endTime')} ? ' is-invalid' : ''"
                                   th:field="*{endTime}" required>
                            <div class="form-error" th:if="${#fields.hasErrors('endTime')}" th:errors="*{endTime}"></div>
                        </div>
                    </div>

                    <!-- Global errors: hiển thị lỗi @AssertTrue -->
                    <div class="form-error mt-3 text-danger fw-semibold"
                         th:if="${#fields.hasGlobalErrors()}">
                        <div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
                    </div>
                </div>
            </div>

            <!-- ========== NỘI DUNG CHI TIẾT (SECTIONS) ========== -->
            <div class="col-12">
                <div class="card card-shadow">
                    <div class="card-header bg-white d-flex align-items-center">
                        <strong class="me-auto">Nội dung chi tiết</strong>
                        <button type="button" class="btn btn-sm btn-primary" id="btnAddSection">+ Thêm phần</button>
                    </div>

                    <div class="card-body" id="sectionsContainer">
                        <div th:each="s, it : *{sections}" class="border rounded p-3 mb-3 section-item">
                            <div class="d-flex justify-content-between mb-2">
                                <h6 class="mb-0">Phần <span th:text="${it.index + 1}">1</span></h6>
                                <button type="button" class="btn btn-sm btn-outline-danger btnRemoveSection">Xóa</button>
                            </div>
                            <div class="row g-3">
                                <div class="col-md-2">
                                    <label class="form-label required" th:for="${'sec-order-' + it.index}">Thứ tự</label>
                                    <input th:id="${'sec-order-' + it.index}" type="number" min="1" class="form-control"
                                           th:classappend="${#fields.hasErrors('sections[' + it.index + '].sectionOrder')} ? ' is-invalid' : ''"
                                           th:field="*{sections[__${it.index}__].sectionOrder}" required>
                                    <div class="form-error"
                                         th:if="${#fields.hasErrors('sections[' + it.index + '].sectionOrder')}"
                                         th:errors="*{sections[__${it.index}__].sectionOrder}"></div>
                                </div>
                                <div class="col-md-10">
                                    <label class="form-label" th:for="${'sec-heading-' + it.index}">Tiêu đề phần</label>
                                    <input th:id="${'sec-heading-' + it.index}" type="text" class="form-control"
                                           th:classappend="${#fields.hasErrors('sections[' + it.index + '].heading')} ? ' is-invalid' : ''"
                                           th:field="*{sections[__${it.index}__].heading}">
                                    <div class="form-error"
                                         th:if="${#fields.hasErrors('sections[' + it.index + '].heading')}"
                                         th:errors="*{sections[__${it.index}__].heading}"></div>
                                </div>
                                <div class="col-12">
                                    <label class="form-label" th:for="${'sec-content-' + it.index}">Mô tả chi tiết</label>
                                    <textarea th:id="${'sec-content-' + it.index}" rows="4" class="form-control"
                                              th:classappend="${#fields.hasErrors('sections[' + it.index + '].content')} ? ' is-invalid' : ''"
                                              th:field="*{sections[__${it.index}__].content}"></textarea>
                                    <div class="form-error"
                                         th:if="${#fields.hasErrors('sections[' + it.index + '].content')}"
                                         th:errors="*{sections[__${it.index}__].content}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" th:for="${'sec-imageUrl-' + it.index}">URL hình ảnh</label>
                                    <input th:id="${'sec-imageUrl-' + it.index}" type="text" class="form-control"
                                           th:classappend="${#fields.hasErrors('sections[' + it.index + '].imageUrl')} ? ' is-invalid' : ''"
                                           th:field="*{sections[__${it.index}__].imageUrl}">
                                    <div class="form-error"
                                         th:if="${#fields.hasErrors('sections[' + it.index + '].imageUrl')}"
                                         th:errors="*{sections[__${it.index}__].imageUrl}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" th:for="${'sec-file-' + it.index}">Chọn hình ảnh</label>
                                    <input th:id="${'sec-file-' + it.index}" class="form-control sectionFile" type="file" accept="image/*"
                                           th:classappend="${#fields.hasErrors('sections[' + it.index + '].imageFile')} ? ' is-invalid' : ''"
                                           th:field="*{sections[__${it.index}__].imageFile}">
                                    <div class="form-error"
                                         th:if="${#fields.hasErrors('sections[' + it.index + '].imageFile')}"
                                         th:errors="*{sections[__${it.index}__].imageFile}"></div>
                                    <img class="section-preview mt-2 img-fluid rounded" style="display:none;" alt="">
                                </div>
                                <div class="col-12">
                                    <label class="form-label" th:for="${'sec-caption-' + it.index}">Chú thích hình ảnh</label>
                                    <input th:id="${'sec-caption-' + it.index}" type="text" class="form-control"
                                           th:classappend="${#fields.hasErrors('sections[' + it.index + '].caption')} ? ' is-invalid' : ''"
                                           th:field="*{sections[__${it.index}__].caption}">
                                    <div class="form-error"
                                         th:if="${#fields.hasErrors('sections[' + it.index + '].caption')}"
                                         th:errors="*{sections[__${it.index}__].caption}"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Template cho JS thêm mới -->
                    <template id="sectionTemplate">
                        <div class="border rounded p-3 mb-3 section-item">
                            <div class="d-flex justify-content-between mb-2">
                                <h6 class="mb-0">Phần <span class="sec-number">1</span></h6>
                                <button type="button" class="btn btn-sm btn-outline-danger btnRemoveSection">Xóa</button>
                            </div>
                            <div class="row g-3">
                                <div class="col-md-2">
                                    <label class="form-label required">Thứ tự</label>
                                    <input type="number" min="1" class="form-control sec-order" required>
                                    <div class="form-error" style="display:none;"></div>
                                </div>
                                <div class="col-md-10">
                                    <label class="form-label">Tiêu đề phần</label>
                                    <input type="text" class="form-control sec-heading">
                                    <div class="form-error" style="display:none;"></div>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Mô tả chi tiết</label>
                                    <textarea rows="4" class="form-control sec-content"></textarea>
                                    <div class="form-error" style="display:none;"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">URL hình ảnh</label>
                                    <input type="text" class="form-control sec-imageUrl">
                                    <div class="form-error" style="display:none;"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Chọn hình ảnh</label>
                                    <input class="form-control sec-file" type="file" accept="image/*">
                                    <div class="form-error" style="display:none;"></div>
                                    <img class="section-preview mt-2 img-fluid rounded" style="display:none;" alt="">
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Chú thích hình ảnh</label>
                                    <input type="text" class="form-control sec-caption">
                                    <div class="form-error" style="display:none;"></div>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- ========== ACTIONS ========== -->
            <div class="col-12 d-flex gap-2">
                <a href="/org/opps" class="btn btn-outline-secondary">Hủy</a>
                <button type="submit" class="btn btn-primary ms-auto">Lưu thay đổi</button>
            </div>
        </div>
    </form>
</div>

<script>
    // Auto-hide flash after 4s
    setTimeout(() => {
        document.querySelectorAll('#flashArea .alert').forEach(a => {
            a.classList.remove('show'); a.classList.add('hide');
            a.addEventListener('transitionend', () => a.remove(), { once: true });
        });
    }, 4000);

    // Preview thumbnail
    const thumbInput = document.getElementById('thumbInput');
    const thumbPreview = document.getElementById('thumbPreview');
    if (thumbInput) {
        thumbInput.addEventListener('change', e => {
            const f = e.target.files[0];
            if (!f) return;
            const url = URL.createObjectURL(f);
            thumbPreview.src = url;
            thumbPreview.style.display = 'block';
        });
    }

    const formEl = document.getElementById('oppForm');
    const sectionsContainer = document.getElementById('sectionsContainer');
    const tmpl = document.getElementById('sectionTemplate');
    const btnAdd = document.getElementById('btnAddSection');

    function wireSectionEvents(wrapper) {
        const btn = wrapper.querySelector('.btnRemoveSection');
        if (btn) btn.addEventListener('click', () => { wrapper.remove(); reindex(); });

        const fileInput = wrapper.querySelector('input[type=file]');
        const imgPrev = wrapper.querySelector('img.section-preview');
        if (fileInput && imgPrev) {
            fileInput.addEventListener('change', e => {
                const f = e.target.files[0];
                if (!f) { imgPrev.style.display = 'none'; return; }
                const url = URL.createObjectURL(f);
                imgPrev.src = url;
                imgPrev.style.display = 'block';
            });
        }
    }

    function setField(root, sel, name, id) {
        const el = root.querySelector(sel);
        if (!el) return;
        el.setAttribute('name', name);
        el.id = id;
        const group = el.closest('.col-md-2, .col-md-10, .col-md-6, .col-12');
        if (group) {
            const label = group.querySelector('label');
            if (label) label.setAttribute('for', id);
        }
    }

    function reindex() {
        const items = sectionsContainer.querySelectorAll('.section-item');
        items.forEach((it, idx) => {
            const num = it.querySelector('.sec-number');
            if (num) num.innerText = idx + 1;
            setField(it, '.sec-order',   `sections[${idx}].sectionOrder`, `sec-order-${idx}`);
            setField(it, '.sec-heading', `sections[${idx}].heading`,      `sec-heading-${idx}`);
            setField(it, '.sec-content', `sections[${idx}].content`,      `sec-content-${idx}`);
            setField(it, '.sec-imageUrl',`sections[${idx}].imageUrl`,     `sec-imageUrl-${idx}`);
            setField(it, '.sec-file',    `sections[${idx}].imageFile`,    `sec-file-${idx}`);
            setField(it, '.sec-caption', `sections[${idx}].caption`,      `sec-caption-${idx}`);
        });
    }

    btnAdd.addEventListener('click', () => {
        const frag = tmpl.content.cloneNode(true);
        sectionsContainer.appendChild(frag);
        const last = sectionsContainer.querySelector('.section-item:last-of-type');
        wireSectionEvents(last);
        reindex();
    });

    sectionsContainer.querySelectorAll('.section-item').forEach(wireSectionEvents);
    reindex();

    // UX: Ẩn lỗi khi người dùng nhập lại hoặc click vào dòng lỗi
    function hideErrorForInput(input) {
        if (!input) return;
        input.classList.remove('is-invalid');
        const group = input.closest('.col-md-2, .col-md-10, .col-md-6, .col-12');
        if (group) {
            const err = group.querySelector('.form-error');
            if (err) err.style.display = 'none';
        }
        document.querySelectorAll('.alert.alert-danger').forEach(a => a.style.display = 'none');
    }

    formEl.addEventListener('input', (e) => {
        const t = e.target;
        if (['INPUT','TEXTAREA','SELECT'].includes(t.tagName)) hideErrorForInput(t);
    });
    formEl.addEventListener('change', (e) => {
        const t = e.target;
        if (['INPUT','TEXTAREA','SELECT'].includes(t.tagName)) hideErrorForInput(t);
    });
    formEl.addEventListener('click', (e) => {
        const err = e.target.closest('.form-error');
        if (!err) return;
        const group = err.closest('.col-md-2, .col-md-10, .col-md-6, .col-12');
        if (group) {
            const input = group.querySelector('input, textarea, select');
            if (input) { input.focus(); hideErrorForInput(input); }
            else { err.style.display = 'none'; }
        } else {
            err.style.display = 'none';
        }
    });
</script>
</body>
</html>
