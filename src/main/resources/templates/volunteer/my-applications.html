<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đơn ứng tuyển của tôi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet" />
    <link th:href="@{/css/schedule.css}" rel="stylesheet" />
    <link th:href="@{/css/volunteer-sidebar.css}" rel="stylesheet" />
    <link th:href="@{/css/application-list.css}" rel="stylesheet" />

    <style>
        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        .container-fluid,
        .row {
            height: 100%;
        }

        .col-9 {
            height: 100%;
            overflow-y: auto;
        }

        .col-3 {
            height: 100%;
            overflow-y: auto;
        }
    </style>
</head>

<body>
    <div th:replace="~{fragments/toast-container :: toasts}"></div>

    <div class="container-fluid">
        <div class="row">
            <div class="col-3 p-0">
                <div th:replace="~{fragments/volunteer/sidebar :: volunteer-sidebar(${activePage})}"></div>
            </div>

            <div class="col-9">
                <div class="schedule-container">
                    <div class="page-header">
                        <h1>Đơn ứng tuyển của tôi</h1>
                        <p>Quản lý và theo dõi trạng thái các đơn ứng tuyển hoạt động tình nguyện</p>
                    </div>

                    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <span th:text="${success}">Thành công</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <span th:text="${error}">Có lỗi</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <!--  filter/search/sort -->
                    <form class="row g-2 align-items-end mb-3" method="get" th:action="@{/profile/applications}">
                        <div class="col-md-4">
                            <label class="form-label">Tìm theo Tổ chức / Cơ hội</label>
                            <input type="text" class="form-control" name="q"
                                placeholder="Nhập tên tổ chức hoặc tiêu đề cơ hội" th:value="${q}">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Trạng thái</label>
                            <select name="status" class="form-select">
                                <option th:value="''" th:selected="${filterStatus == ''}">Tất cả</option>
                                <option value="PENDING" th:selected="${filterStatus == 'PENDING'}">Đang chờ</option>
                                <option value="APPROVED" th:selected="${filterStatus == 'APPROVED'}">Đã duyệt</option>
                                <option value="REJECTED" th:selected="${filterStatus == 'REJECTED'}">Từ chối</option>
                                <option value="COMPLETED" th:selected="${filterStatus == 'COMPLETED'}">Hoàn thành
                                </option>
                                <option value="CANCELLED" th:selected="${filterStatus == 'CANCELLED'}">Đã hủy</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Sắp xếp</label>
                            <select name="sort" class="form-select">
                                <option value="newest" th:selected="${sort=='newest'}">Mới nhất</option>
                                <option value="oldest" th:selected="${sort=='oldest'}">Cũ nhất</option>
                            </select>
                        </div>
                        <div class="col-md-2 d-grid">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-search"></i> Lọc
                            </button>
                        </div>
                    </form>

                    <div class="section">
                        <div class="card border-0 shadow-sm">
                            <div class="table-responsive">
                                <table class="table align-middle mb-0">
                                    <thead class="table-light">
                                        <tr>
                                            <th style="width: 20%">Tổ chức</th>
                                            <th style="width: 22%">Cơ hội</th>
                                            <th style="width: 33%">Mô tả ngắn</th>
                                            <th style="width: 12%">Trạng thái</th>
                                            <th style="width: 13%">Hành động</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:if="${#lists.isEmpty(items)}">
                                            <td colspan="5" class="text-center text-secondary py-4">
                                                Không có đơn nào phù hợp bộ lọc.
                                            </td>
                                        </tr>

                                        <tr th:each="a : ${items}">
                                            <td th:text="${a.opportunity.organization.name}">Tên tổ chức</td>
                                            <td>
                                                <div class="fw-semibold" th:text="${a.opportunity.title}">Tiêu đề</div>
                                                <div class="text-secondary small">
                                                    Nộp ngày
                                                    <span
                                                        th:text="${#temporals.format(a.appliedAt,'dd/MM/yyyy HH:mm')}">01/01/2025
                                                        10:00</span>
                                                </div>
                                            </td>
                                            <td th:text="${a.opportunity.subtitle}">Mô tả ngắn...</td>
                                            <td>
                                                <span class="badge"
                                                    th:classappend="${a.status.name()=='PENDING' ? ' bg-secondary' :
                                                (a.status.name()=='APPROVED' ? ' bg-primary' :
                                                (a.status.name()=='REJECTED' ? ' bg-danger' :
                                                (a.status.name()=='COMPLETED' ? ' bg-success' :
                                                (a.status.name()=='CANCELLED' ? ' bg-dark' : ' bg-light text-dark'))))}" th:text="${a.status.name()=='PENDING' ? 'Đang chờ' :
                                                (a.status.name()=='APPROVED' ? 'Đã duyệt' :
                                                (a.status.name()=='REJECTED' ? 'Từ chối' :
                                                (a.status.name()=='COMPLETED' ? 'Hoàn thành' :
                                                (a.status.name()=='CANCELLED' ? 'Đã hủy' : a.status.toString()))))}">
                                                </span>
                                            </td>
                                            <td>
                                                <div class="d-flex gap-2">
                                                    <a class="btn btn-sm btn-outline-secondary"
                                                        th:href="@{/opportunities/{id}(id=${a.opportunity.oppId})}">
                                                        Chi tiết
                                                    </a>
                                                    <button class="btn btn-sm btn-danger"
                                                        th:disabled="${a.status.name()!='PENDING'}" type="button">
                                                        Hủy bỏ
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                            <!--  Pagination -->
                            <div class="card-footer d-flex justify-content-between align-items-center">
                                <div class="text-muted small">
                                    Trang <span th:text="${currentPage + 1}">1</span>/<span
                                        th:text="${totalPages}">1</span>
                                </div>
                                <nav>
                                    <ul class="pagination mb-0">
                                        <li class="page-item" th:classappend="${currentPage <= 0} ? ' disabled'">
                                            <a class="page-link"
                                                th:href="@{/profile/applications(page=${currentPage - 1}, q=${q}, status=${filterStatus}, sort=${sort})}">
                                                «
                                            </a>
                                        </li>
                                        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages-1)}"
                                            th:classappend="${i == currentPage} ? ' active'">
                                            <a class="page-link" th:text="${i+1}"
                                                th:href="@{/profile/applications(page=${i}, q=${q}, status=${filterStatus}, sort=${sort})}">1</a>
                                        </li>
                                        <li class="page-item"
                                            th:classappend="${currentPage >= totalPages-1} ? ' disabled'">
                                            <a class="page-link"
                                                th:href="@{/profile/applications(page=${currentPage + 1}, q=${q}, status=${filterStatus}, sort=${sort})}">
                                                »
                                            </a>
                                        </li>
                                    </ul>
                                </nav>
                            </div>
                            <!-- /Pagination -->

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/toast-utils.js}"></script>
</body>

</html>
