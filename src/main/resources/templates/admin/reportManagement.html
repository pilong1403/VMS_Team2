<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Báo cáo</title>
    <link rel="stylesheet" th:href="@{/css/styleUser.css}" />
</head>
<body data-page="reports">
<div th:replace="~{fragments/admin/sidebar :: sidebar}"></div>


<div class="main-wrapper">
    <header >
        <div th:replace="~{fragments/admin/header :: header}"></div>
    </header>

    <main class="content">
        <div class="page-header">
            <h1>Báo cáo</h1>
            <!-- KPI -->
            <div class="kpi-row">
                <div class="kpi-card">
                    <div class="kpi-label">Tình nguyện viên</div>
                    <div class="kpi-number" th:text="${summary.volunteers}">0</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">Người tổ chức</div>
                    <div class="kpi-number" th:text="${summary.organizations}">0</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">Cơ hội và tổ chức</div>
                    <div class="kpi-number" th:text="${summary.opportunities}">0</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">Quản trị viên</div>
                    <div class="kpi-number" th:text="${summary.admins}">0</div>
                </div>
            </div>

            <div class="toggle-report-row">
                <button type="button" class="btn btn-outline"
                        onclick="toggleSection('userReportSection')">
                    Ẩn / Hiện báo cáo người dùng
                </button>
                <button type="button" class="btn btn-outline"
                        onclick="toggleSection('oppReportSection')">
                    Ẩn / Hiện báo cáo cơ hội
                </button>
            </div>
        </div>

        <!-- ====== BÁO CÁO NGƯỜI DÙNG ====== -->
        <section id="userReportSection">
        <div class="page-header">
            <h2>Thống kê người dùng theo thời gian </h2>
        </div>
        <!-- ====== FORM LỌC BÁO CÁO ====== -->
        <form th:action="@{/admin/reports}" method="get" class="search-filter-bar">
            <div class="filter-group">
                <select name="rangeType">
                    <option value="week" th:selected="${rangeType == 'week'}">Tuần</option>
                    <option value="month" th:selected="${rangeType == 'month'}">Tháng</option>
                    <option value="year" th:selected="${rangeType == 'year'}">Năm</option>
                </select>

                <input type="date" name="fromDate" th:value="${fromDate}" />
                <input type="date" name="toDate" th:value="${toDate}" />



                <button type="submit" class="btn btn-outline">Lọc</button>
            </div>

            <div class="search-wrapper">

            </div>
        </form>

        <!-- ====== BIỂU ĐỒ ====== -->
        <!-- HÀNG 1: Bar -->
        <!-- HÀNG 1: Bar, full width -->
        <div class="chart-row chart-row--single">
            <div class="card">
                <div class="card-header" style="display:flex;justify-content:space-between;align-items:center">
                    <h3>Biểu đồ người dùng đăng ký</h3>
                    <div>
                        <button id="btnBack" class="btn btn-outline" style="display:none" onclick="goBackChart()">⬅ Quay lại</button>
                        <button class="btn-export" onclick="exportChartToExcel('user')">Tải Excel</button>
                    </div>
                </div>
                <canvas id="userChartUser" height="200"></canvas>
            </div>
        </div>


        <!-- HÀNG 2: 2 Pie -->
        <div class="chart-row">
            <div class="card">
                <div class="card-header" style="display:flex;justify-content:space-between;align-items:center">
                    <h3>Phân bố theo vai trò</h3>
                    <button class="btn-export" onclick="exportChartToExcel('role')">Tải Excel</button>
                </div>
                <canvas id="roleChart" height="200"></canvas>
            </div>

            <div class="card">
                <div class="card-header" style="display:flex;justify-content:space-between;align-items:center">
                    <h3>Trạng thái người dùng</h3>
                    <button class="btn-export" onclick="exportChartToExcel('status')">Tải Excel</button>
                </div>
                <canvas id="statusChart" height="200"></canvas>
            </div>
        </div>
        </section>

        <!-- ====== BẢNG DỮ LIỆU cơ hội (nếu cần thêm thống kê chi tiết) ====== -->
        <section id="oppReportSection">

        <hr style="margin:2rem 0">

        <div class="page-header">
            <h2>Thống kê cơ hội </h2>
        </div>

        <form th:action="@{/admin/reports}" method="get" class="search-filter-bar">
            <div class="filter-group">
                <select name="oppRangeType">
                    <option value="week"  th:selected="${oppRangeType == 'week'}">Tuần</option>
                    <option value="month" th:selected="${oppRangeType == 'month'}">Tháng</option>
                    <option value="year"  th:selected="${oppRangeType == 'year'}">Năm</option>
                </select>

                <input type="date" name="oppFromDate" th:value="${oppFromDate}" />
                <input type="date" name="oppToDate"   th:value="${oppToDate}" />

                <button type="submit" class="btn btn-outline">Lọc cơ hội</button>
            </div>
        </form>

        <!-- Hàng 1: biểu đồ đường Opportunity -->
        <div class="chart-row chart-row--single">
            <div class="card">
                <div class="card-header" style="display:flex;justify-content:space-between;align-items:center">
                    <h3>Biểu đồ cơ hội theo thời gian</h3>
                    <button class="btn-export" onclick="exportOppChartToExcel('opp')">Tải Excel</button>
                </div>
                <canvas id="oppChart" height="200"></canvas>
            </div>
        </div>

        <!-- Hàng 2: pie status Opportunity -->
        <div class="chart-row">
            <div class="card">
                <div class="card-header" style="display:flex;justify-content:space-between;align-items:center">
                    <h3>Trạng thái cơ hội</h3>
                    <button class="btn-export" onclick="exportOppChartToExcel('oppStatus')">Tải Excel</button>
                </div>
                <canvas id="oppStatusChart" height="200"></canvas>
            </div>
        </div>
        </section>

    </main>
</div>

<div class="toast" id="toast">
    <div class="toast-content">
        <strong id="toastTitle"></strong>
        <p id="toastMessage"></p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>

<!-- ====== BIỂU ĐỒ JS (Thymeleaf inline data) ====== -->
<script th:inline="javascript">
    /*<![CDATA[*/

    // ===== DỮ LIỆU TỪ BACKEND (Thymeleaf render) =====
    const userLabels = /*[[${userStats.labels}]]*/ [];
    const userCounts = /*[[${userStats.counts}]]*/ [];
    const roleData = /*[[${roleDistribution}]]*/ {};
    let currentRange = /*[[${rangeType}]]*/ 'month';

    // ===== VẼ BIỂU ĐỒ TRÒN (ROLE) =====
    const ctxRole = document.getElementById('roleChart');
    new Chart(ctxRole, {
        type: 'pie',
        data: {
            labels: Object.keys(roleData),
            datasets: [{
                data: Object.values(roleData),
                backgroundColor: ['#007bff','#ffc107','#28a745','#dc3545','#17a2b8']
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { position: 'right' } }
        }
    });

    // ===== VẼ BIỂU ĐỒ CỘT (USER) =====
    let userChart;
    const ctxUser = document.getElementById('userChartUser');

    // Stack để lưu lịch sử drilldown (quay lại)
    const drillStack = [];

    function renderUserChart(labels, counts) {
        if (userChart) userChart.destroy();
        userChart = new Chart(ctxUser, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Số lượng người dùng đăng ký',
                    data: counts,
                    backgroundColor: '#007bff'
                }]
            },
            options: {
                responsive: true,
                scales: { y: { beginAtZero: true } },
                plugins: {
                    legend: { display: false },
                    tooltip: { enabled: true }
                },
                // ======= CLICK TRÊN CỘT ĐỂ DRILLDOWN =======
                onClick: (event, elements) => {
                    if (elements.length > 0) {
                        const index = elements[0].index;
                        const label = labels[index];
                        drillDown(label);
                    }
                }
            }
        });
    }

    // render chart lần đầu
    renderUserChart(userLabels, userCounts);

    // ======= DRILLDOWN API CALL =======

    function drillDown(label) {
        drillStack.push({
            labels: userChart.data.labels.slice(),
            counts: userChart.data.datasets[0].data.slice(),
            range: currentRange
        });

        document.getElementById('btnBack').style.display = 'inline-block';

        fetch(`/admin/reports/drilldown?rangeType=${currentRange}&label=${encodeURIComponent(label)}`)
            .then(res => res.json())
            .then(data => {
                if (data && data.labels && data.counts) {
                    currentRange = data.rangeType || currentRange;   // nhớ cập nhật level mới
                    renderUserChart(data.labels, data.counts);
                } else {
                    showToast("Không có dữ liệu chi tiết.", "Thông báo");
                }
            })
            .catch(err => console.error("Drilldown error:", err));
    }


    const statusData = /*[[${statusDistribution}]]*/ {}; // {ACTIVE: x, LOCKED: y}

    // Pie: Status
    const ctxStatus = document.getElementById('statusChart');
    new Chart(ctxStatus, {
        type: 'pie',
        data: {
            labels: Object.keys(statusData),
            datasets: [{
                data: Object.values(statusData),
                backgroundColor: ['#28a745','#dc3545'] // ACTIVE, LOCKED
            }]
        },
        options: { responsive:true, plugins:{ legend:{ position:'right' } } }
    });

    // ======= BIỂU ĐỒ CƠ HỘI =======
    // ====== DỮ LIỆU OPS TỪ BACKEND ======
    const oppLabels = /*[[${oppStats.labels}]]*/ [];
    const oppCounts = /*[[${oppStats.counts}]]*/ [];
    const oppStatusData = /*[[${oppStatusDistribution}]]*/ {}; // {OPEN: x, CLOSED: y ...}

    // Line chart Opportunity
    const ctxOpp = document.getElementById('oppChart');
    let oppChart = new Chart(ctxOpp, {
        type: 'line',
        data: {
            labels: oppLabels,
            datasets: [{
                label: 'Số lượng cơ hội',
                data: oppCounts,
                borderColor: '#007bff',
                backgroundColor: 'rgba(0,123,255,0.15)',
                tension: 0.3,
                fill: true
            }]
        },
        options: {
            responsive: true,
            scales: { y: { beginAtZero: true } },
            plugins: {
                legend: { display: false },
                tooltip: { enabled: true }
            }
        }
    });

    // Pie chart Opportunity Status
    const ctxOppStatus = document.getElementById('oppStatusChart');
    new Chart(ctxOppStatus, {
        type: 'pie',
        data: {
            labels: Object.keys(oppStatusData),
            datasets: [{
                data: Object.values(oppStatusData),
                backgroundColor: ['#007bff', '#28a745', '#ffc107', '#dc3545']
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { position: 'right' } }
        }
    });


    // ======= NÚT QUAY LẠI =======
    function goBackChart() {
        const prev = drillStack.pop();
        if (prev) {
            renderUserChart(prev.labels, prev.counts);
            currentRange = prev.range;
        }
        if (drillStack.length === 0) {
            document.getElementById('btnBack').style.display = 'none';
        }
    }

    // ======= HIỂN THỊ TOAST NGẮN =======
    function showToast(message, title="Thông báo") {
        const toast = document.getElementById('toast');
        const toastTitle = document.getElementById('toastTitle');
        const toastMessage = document.getElementById('toastMessage');
        toastTitle.innerText = title;
        toastMessage.innerText = message;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
    }
    // ======= XUẤT EXCEL =======
        function exportChartToExcel(type) {
        const params = new URLSearchParams();
        params.append("type", type);
        params.append("rangeType", currentRange);

        const from = document.querySelector('input[name="fromDate"]').value;
        const to = document.querySelector('input[name="toDate"]').value;
        if (from) params.append("fromDate", from);
        if (to) params.append("toDate", to);

        // Gọi server backend để tải Excel
        window.location.href = `/admin/reports/export?${params.toString()}`;
    }

    // ======= XUẤT EXCEL CƠ HỘI =======
    function exportOppChartToExcel(type) {
        const params = new URLSearchParams();
        params.append("type", type);

        // lấy rangeType của cơ hội
        const oppRangeSelect = document.querySelector('select[name="oppRangeType"]');
        if (oppRangeSelect) {
            params.append("rangeType", oppRangeSelect.value);
        }

        // lấy from/to của cơ hội, map về fromDate/toDate cho controller
        const oppFrom = document.querySelector('input[name="oppFromDate"]')?.value;
        const oppTo   = document.querySelector('input[name="oppToDate"]')?.value;

        if (oppFrom) params.append("fromDate", oppFrom);
        if (oppTo)   params.append("toDate", oppTo);

        // Gọi endpoint xuất Excel
        window.location.href = `/admin/reports/export?${params.toString()}`;
    }


    // header profile
    document.addEventListener('DOMContentLoaded', function () {
        const profileDropdown = document.getElementById('profileDropdown');
        const dropdownMenu = document.getElementById('dropdownMenu');

        if (profileDropdown) {
            profileDropdown.addEventListener('click', function (event) {
                event.stopPropagation(); // Ngăn sự kiện click lan ra ngoài
                dropdownMenu.classList.toggle('show');
            });
        }

        // Đóng dropdown khi click ra ngoài
        window.addEventListener('click', function (event) {
            if (dropdownMenu && dropdownMenu.classList.contains('show')) {
                dropdownMenu.classList.remove('show');
            }
        });
    });

    document.addEventListener('DOMContentLoaded', function () {
        const sidebarProfile = document.getElementById('sidebarProfile');
        const sidebarDropdownMenu = document.getElementById('sidebarDropdownMenu');

        if (sidebarProfile) {
            sidebarProfile.addEventListener('click', function (event) {
                event.stopPropagation();
                sidebarDropdownMenu.classList.toggle('show');
            });
        }

        // Đóng dropdown khi click ra ngoài
        window.addEventListener('click', function (event) {
            if (sidebarDropdownMenu && sidebarDropdownMenu.classList.contains('show')) {
                sidebarDropdownMenu.classList.remove('show');
            }
        });
    });

    /*]]>*/

    function toggleSection(sectionId) {
        const el = document.getElementById(sectionId);
        if (!el) return;

        // toggle class
        const isHidden = el.classList.toggle('hidden-section');

        // lưu trạng thái vào localStorage
        localStorage.setItem('reportSection_' + sectionId, isHidden ? 'hidden' : 'visible');
    }
    document.addEventListener('DOMContentLoaded', function () {
        ['userReportSection', 'oppReportSection'].forEach(function (id) {
            const el = document.getElementById(id);
            if (!el) return;

            const saved = localStorage.getItem('reportSection_' + id);
            if (saved === 'hidden') {
                el.classList.add('hidden-section');
            } else {
                el.classList.remove('hidden-section');
            }
        });

    });


</script>


</body>
</html>
