<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách Hoạt động</title>
    <link rel="stylesheet" th:href="@{/css/rate.css}">
</head>
<body>
<div class="app">

    <!-- 1. Sidebar (Không thay đổi) -->
    <div th:replace="~{fragments/organization/sidebar :: sidebar}"></div>

    <!-- 2. Wrapper mới cho nội dung bên phải -->
    <div class="content-wrapper">

        <!-- 2a. Header (Đã được đưa ra ngoài main) -->
        <!-- Chúng ta bọc header trong một container mới để tạo nền trắng và viền -->
        <div class="header-container">
            <div th:replace="~{fragments/organization/header :: header}"></div>
        </div>

        <!-- 2b. Main (Bây giờ chỉ chứa nội dung có thể cuộn) -->
        <main class="main">

            <!-- Toolbar -->
            <form method="get" class="toolbar">
                <input type="text" name="keyword" th:value="${keyword}" placeholder="Tìm theo tên hoạt động..." class="search-input"/>

                <select name="eventStatus" class="select">
                    <option value="all" th:selected="${eventStatus == 'all'}">Tất cả trạng thái</option>
                    <option value="upcoming" th:selected="${eventStatus == 'upcoming'}">Sắp diễn ra</option>
                    <option value="ongoing" th:selected="${eventStatus == 'ongoing'}">Đang diễn ra</option>
                    <option value="finished" th:selected="${eventStatus == 'finished'}">Đã kết thúc</option>
                </select>

                <select name="sort" class="select">
                    <option value="recent" th:selected="${sort == 'recent'}">Gần nhất</option>
                    <option value="oldest" th:selected="${sort == 'oldest'}">Cũ nhất</option>
                    <option value="name" th:selected="${sort == 'name'}">Tên (A → Z)</option>
                    <option value="participants" th:selected="${sort == 'participants'}">Số TNV nhiều nhất</option>
                </select>

                <button type="submit" class="btn primary">Lọc</button>
            </form>

            <!-- List -->
            <section class="list">
                <div th:if="${#lists.isEmpty(opportunities)}" class="empty">
                    Không có hoạt động nào phù hợp.
                </div>

                <div class="card" th:each="o : ${opportunities}">
                    <div class="card-head">
                        <div class="info">
                            <div  class="name" th:text="${'Tên tổ chức sự kiện: '+o.opportunityTitle}">Tên hoạt động</div>

                            <div class="muted">
                                <span> Thời gian bắt đầu: </span>
                                <span th:text="${#temporals.format(o.startTime, 'dd/MM/yyyy HH:mm')}"></span>
                                <span>--- Thời gian kết thúc:  </span>
                                <span th:text="${#temporals.format(o.endTime, 'dd/MM/yyyy HH:mm')}"></span>
                            </div>

                            <div class="meta">
                                <span>Địa điểm: </span>
                                <span th:text="${o.location}">Địa điểm</span>
                                <span class="dot"> </span>
                                <span th:text="${o.participantCount + ' Tình Nguyện Viên'}">0 TNV</span>
                            </div>
                        </div>

                        <!-- Status -->
                        <div class="status-pill"
                             th:classappend="${o.endTime.isBefore(#temporals.createNow()) ? 'success' :
                                              (o.startTime.isAfter(#temporals.createNow()) ? 'warning' : 'primary')}"
                             th:text="${o.endTime.isBefore(#temporals.createNow()) ? 'Đã kết thúc' :
                                      (o.startTime.isAfter(#temporals.createNow()) ? 'Sắp diễn ra' : 'Đang diễn ra')}">
                        </div>
                    </div>

                    <div class="actions">
                        <a class="btn primary"

                           th:href="@{'/organization/attendance-details?opportunityId=' + ${o.opportunityId}}">
                            Điểm danh
                        </a>

                        <a class="btn success"
                           th:classappend="${!o.endTime.isBefore(#temporals.createNow()) ? 'disabled' : ''}"
                           th:href="@{'/organization/ratings/opportunity/' + ${o.opportunityId}}">
                            Đánh giá
                        </a>
                    </div>
                </div>
            </section>

            <!-- Phân trang -->
            <div class="pagination" th:if="${totalPages > 1}">
                <a th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                   th:href="@{/organization/ratings/opportunities(page=${i}, keyword=${keyword}, sort=${sort}, eventStatus=${eventStatus})}"
                   th:text="${i + 1}"
                   th:classappend="${i == currentPage} ? 'btn primary' : 'btn ghost'"></a>
            </div>
        </main>

    </div> <!-- Đóng .content-wrapper -->

</div>

<script th:src="@{/js/rate.js}"></script>
</body>
</html>
