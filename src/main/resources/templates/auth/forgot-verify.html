<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Xác minh OTP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5" style="max-width: 520px;">
  <h3 class="mb-1">Nhập mã OTP</h3>
  <p class="text-muted mb-3">
    Chúng tôi đã gửi mã xác minh tới
    <strong th:text="${email}"></strong>.
  </p>

  <div th:if="${error}"
       id="otpError"
       class="alert alert-warning"
       th:text="${error}"></div>

  <!-- FORM 1: XÁC MINH OTP -->
  <form th:action="@{/forgot-password/verify}" method="post" class="vstack gap-3 mb-2">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <div>
      <label class="form-label">Mã OTP</label>
      <input class="form-control"
             type="text"
             name="code"
             inputmode="numeric"
             pattern="[0-9]{6}"
             maxlength="6"
             placeholder="6 chữ số"
             required
             autocomplete="one-time-code" />
      <div class="form-text">Mã có hiệu lực 5 phút.</div>
    </div>

    <div>
      <button class="btn btn-primary" type="submit">Xác minh</button>
    </div>
  </form>

  <!-- FORM 2: GỬI LẠI MÃ -->
  <div class="d-flex align-items-center gap-2">
    <span class="text-muted small">Không nhận được mã?</span>
    <form th:action="@{/forgot-password/resend}" method="post" class="d-inline">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button id="resendBtn"
              class="btn btn-outline-secondary btn-sm"
              type="submit"
              disabled>
        Gửi lại (<span id="countdown">30</span>s)
      </button>
    </form>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const resendBtn = document.getElementById("resendBtn");
    const countdown = document.getElementById("countdown");
    const otpError  = document.getElementById("otpError");

    // Đếm ngược cho nút Gửi lại mã (độc lập, không liên quan nút Xác minh)
    if (resendBtn && countdown) {
      let time = 30;
      const timer = setInterval(() => {
        time--;
        countdown.textContent = time;
        if (time <= 0) {
          clearInterval(timer);
          resendBtn.disabled = false;
          resendBtn.textContent = "Gửi lại mã";
        }
      }, 1000);
    }

    // Ẩn thông báo lỗi sau 5 giây
    if (otpError) {
      setTimeout(() => {
        otpError.classList.add("d-none");
      }, 5000);
    }
  });
</script>
</body>
</html>
